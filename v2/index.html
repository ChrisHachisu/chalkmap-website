      <div class="faq-list" data-faq-list>
        <div class="faq-item">
          <button class="faq-question" aria-expanded="false">
            <span data-en="What is ChalkMap, and how do I get started?" data-ja="ChalkMapとは？どう始めればいいですか？"></span>
            <svg class="faq-caret" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="faq-answer">
            <div class="faq-answer-inner" data-en="ChalkMap is a community-built information platform for outdoor bouldering. Every crag, boulder, and problem on the map is contributed and kept current by the climbers who actually climb there: grades, photos, line drawings, danger notes, and local access info in one place.&#10;&#10;To get started, download the app, create a free account, and open the map to explore crags near you. You can browse and log climbs right away; adding content is available once you're signed in." data-ja="ChalkMapは、外岩ボルダリングのためのコミュニティ型情報プラットフォームです。地図上のエリア・ボルダー・課題はすべて、実際にそこで登るクライマーが投稿し、最新に保っています。グレード、写真、ライン、危険度、アクセス情報がひとつにまとまっています。&#10;&#10;まずはアプリをダウンロードして無料アカウントを作成し、地図を開いて近くのエリアを探してみてください。閲覧と完登の記録はすぐに使えます。コンテンツの追加はサインイン後に可能です。"></div>
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-question" aria-expanded="false">
            <span data-en="How do I add content: crags, boulders, problems, and photos?" data-ja="エリアやボルダー、課題、写真はどうやって追加しますか？"></span>
            <svg class="faq-caret" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="faq-answer">
            <div class="faq-answer-inner" data-en="Tap the + button on the map or crag detail screen to add a new crag, boulder, problem, or parking spot. All new content starts private, and only you can see it until you choose to make it public.&#10;&#10;When you're ready to share, tap Make public and the app runs a quick content check; if it passes, the item goes live on the public map. Photos can be added to any boulder or crag from the detail screen." data-ja="地図またはエリア詳細画面の「＋」ボタンから、新しいエリア・ボルダー・課題・駐車場を追加できます。新しく追加した情報はすべて非公開から始まり、公開するまで自分にしか見えません。&#10;&#10;共有する準備ができたら「公開する」をタップします。簡単な内容チェックを通過すると、公開マップに表示されます。写真はボルダーやエリアの詳細画面からいつでも追加できます。"></div>
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-question" aria-expanded="false">
            <span data-en="Who can add to a crag? Creator, co-establishers, and guests" data-ja="エリアに追加できるのは誰？（作成者・共同開拓者・ゲスト）"></span>
            <svg class="faq-caret" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="faq-answer">
            <div class="faq-answer-inner" data-en="Every crag has a creator: the climber who adds it to ChalkMap and controls it. From Manage Access, the creator can invite other climbers as co-establishers (who can add boulders and problems) or as guests (who can view the crag and log climbs, but not add content).&#10;&#10;On a public crag, any signed-in climber can add content. On a private crag, only the creator and co-establishers can add; guests get view-and-log access. Being the creator is about managing the crag in the app, which is separate from who is credited as its establisher (see below)." data-ja="どのエリアにも作成者がいます。そのエリアをChalkMapに追加して管理するクライマーです。作成者は「アクセス管理」から、ほかのクライマーを共同開拓者（ボルダーや課題を追加できる）またはゲスト（閲覧と完登の記録はできるが、追加はできない）として招待できます。&#10;&#10;公開エリアでは、サインインしているクライマーなら誰でも情報を追加できます。非公開エリアで追加できるのは作成者と共同開拓者のみで、ゲストは閲覧と完登の記録のみです。作成者とは、アプリ上でそのエリアを管理する人のことで、開拓者として認定される人とは別です（下記参照）。"></div>
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-question" aria-expanded="false">
            <span data-en="Who is the establisher (FA)? What if I add a line someone else first climbed?" data-ja="開拓者（初登者）とは？自分が初登していないラインを追加するときは？"></span>
            <svg class="faq-caret" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="faq-answer">
            <div class="faq-answer-inner" data-en="Establishing is a credit, separate from who created the entry in the app. The establisher is the climber recognized as having established a crag, boulder, or problem; for a problem, that is the first ascensionist (FA).&#10;&#10;You can claim it yourself (Claim as establisher, or Claim FA), or the creator can set it for the actual climber and send them an establisher invite code. The creator reviews establisher claims. So the climber who creates a crag in the app and the climber credited as its establisher can be the same person, but they don't have to be." data-ja="開拓は功績であり、アプリ上で誰が情報を追加したかとは別です。開拓者とは、そのエリア・ボルダー・課題を開拓したと認定されるクライマーで、課題の場合は初登者（FA）にあたります。&#10;&#10;自分で「開拓者として申請」「初登者として申請」することもできますし、作成者が実際のクライマーを「開拓者を設定」で設定したり、開拓者コードを発行して渡したりもできます。開拓者の申請は作成者が確認します。つまり、アプリ上でエリアを作成した人と、その開拓者として認定される人は、同じでも、別々でもかまいません。"></div>
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-question" aria-expanded="false">
            <span data-en="How do I invite people to a private crag?" data-ja="非公開エリアに人を招待するには？"></span>
            <svg class="faq-caret" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="faq-answer">
            <div class="faq-answer-inner" data-en="From the crag's Manage Access screen, tap Invite climbers. You can search by username, invite followers, or generate a single-use invite code (valid 7 days) to share however you like.&#10;&#10;Invited climbers join as guests by default. You can promote anyone to co-establisher from Manage Access at any time, and change it back later." data-ja="エリアの「アクセス管理」画面から「クライマーを招待」をタップします。ユーザー名で検索する、フォロワーから選ぶ、7日間有効の使い切り招待コードを発行して好きな方法で共有する、のいずれの方法でも招待できます。&#10;&#10;招待されたクライマーは最初はゲストとして参加します。アクセス管理からいつでも共同開拓者に昇格でき、後から戻すことも可能です。"></div>
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-question" aria-expanded="false">
            <span data-en="Who can see my content? Public vs. private" data-ja="自分の投稿は誰に見えますか？（公開と非公開）"></span>
            <svg class="faq-caret" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="faq-answer">
            <div class="faq-answer-inner" data-en="When a crag is private, it is invisible to everyone except the creator, co-establishers, and invited guests. When a crag is public (after passing review), it appears on the map and in search for everyone. Boulders and problems inherit the visibility of their parent crag.&#10;&#10;If you need to take a public crag back to private (say an access issue arises), you can request that. To protect the community, un-publishing goes through a quick review by our team rather than flipping instantly." data-ja="非公開のエリアは、作成者・共同開拓者・招待されたゲスト以外には一切見えません。公開エリアは（確認を通過した後）すべてのユーザーの地図と検索に表示されます。ボルダーや課題の公開範囲は、属するエリアに従います。&#10;&#10;アクセス上の問題などで公開エリアを非公開に戻したい場合も、申請できます。コミュニティを守るため、非公開化はすぐには反映されず、運営による確認を経て行われます。"></div>
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-question" aria-expanded="false">
            <span data-en="How do I report a problem or flag unsafe content?" data-ja="問題のある投稿や危険な情報を報告するには？"></span>
            <svg class="faq-caret" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="faq-answer">
            <div class="faq-answer-inner" data-en="Tap Report on any crag, boulder, problem, parking spot, send, comment, user, or photo, then choose a type: a safety / access concern (closures, dangerous landings, access issues, visible to the community on that content's page), inappropriate content (spam, false info, harassment, goes to the ChalkMap team only), or a removal request.&#10;&#10;You can attach a photo to safety reports. Once submitted, you'll see a confirmation." data-ja="エリア・ボルダー・課題・駐車場・完登・コメント・ユーザー・写真のどれでも、「報告」から知らせることができます。種類は3つ：安全・アクセスに関する報告（閉鎖、危険な下地、アクセス問題など、その情報のページでコミュニティにも表示されます）、不適切なコンテンツ（スパム、虚偽情報、嫌がらせなど、運営のみに届きます）、削除のリクエスト。&#10;&#10;安全に関する報告には写真も添付できます。送信後、確認メッセージが表示されます。"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
