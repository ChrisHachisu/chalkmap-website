<section id="map" class="section section-map">
  <div class="container">
    <div class="map-header" data-map-header>
      <span class="eyebrow" data-en="PUBLIC CRAGS · 公開エリア" data-ja="PUBLIC CRAGS · 公開エリア"></span>
      <h2 data-en="Real crags. Real access info." data-ja="本物のエリアと、本物のアクセス情報。"></h2>
      <p class="map-intro" data-en="ChalkMap launched in summer 2026. These are the first public crags. More open as establishers publish them." data-ja="ChalkMapは2026年夏に公開されました。これが最初の公開エリアです。開拓者が公開するたびに、地図は広がります。"></p>
    </div>

    <div class="map-layout">
      <div class="map-pin-col">
        <div class="map-card">
          <img class="map-bg-img" data-map-bg-img src="assets/img/japan-map.png" data-alt-en="Map of Japan" data-alt-ja="日本地図" alt="" loading="lazy" hidden onload="this.hidden=false" onerror="this.remove()">
          <div class="map-dotgrid" aria-hidden="true"></div>
          <div class="map-pins" data-map-pins>
            <div class="map-pin map-pin--active" data-map-pin data-crag-index="0" style="left:52.55%;top:65.57%">
              <span class="map-pin-marker"><span class="map-pin-halo" aria-hidden="true"></span><span class="map-pin-dot" aria-hidden="true"></span></span>
              <span class="map-pin-label" data-en="Ogawayama" data-ja="小川山"></span>
            </div>
            <div class="map-pin" data-map-pin data-crag-index="1" style="left:53.83%;top:65.34%">
              <span class="map-pin-marker"><span class="map-pin-halo" aria-hidden="true"></span><span class="map-pin-dot" aria-hidden="true"></span></span>
              <span class="map-pin-label" data-en="Mitsumine" data-ja="三峰"></span>
            </div>
            <div class="map-pin" data-map-pin data-crag-index="2" style="left:53.17%;top:63.61%">
              <span class="map-pin-marker"><span class="map-pin-halo" aria-hidden="true"></span><span class="map-pin-dot" aria-hidden="true"></span></span>
              <span class="map-pin-label" data-en="Shimonita" data-ja="下仁田"></span>
            </div>
            <div class="map-pin" data-map-pin data-crag-index="3" style="left:54.66%;top:66.27%">
              <span class="map-pin-marker"><span class="map-pin-halo" aria-hidden="true"></span><span class="map-pin-dot" aria-hidden="true"></span></span>
              <span class="map-pin-label" data-en="Mitake" data-ja="御岳"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="map-steps-col">
        <div class="map-step" data-map-step data-crag-index="0">
          <div class="map-step-photo" data-map-photo>
            <picture>
              <source type="image/webp" srcset="assets/img/web/ogawayama-1200.webp">
              <img src="assets/img/web/ogawayama-1200.jpg" data-alt-en="Ogawayama, Nagano" data-alt-ja="長野県、小川山" alt="" loading="lazy" width="1200" height="900">
            </picture>
          </div>
          <span class="eyebrow" data-en="NAGANO" data-ja="長野"></span>
          <h2 data-en="Ogawayama." data-ja="小川山。"></h2>
          <p data-en="One of Japan's most iconic classic climbing areas." data-ja="日本を代表するクラシックなクライミングエリア。"></p>
        </div>

        <div class="map-step" data-map-step data-crag-index="1">
          <div class="map-step-photo" data-map-photo>
            <picture>
              <source type="image/webp" srcset="assets/img/web/mitsumine-1200.webp">
              <img src="assets/img/web/mitsumine-1200.jpg" data-alt-en="Mitsumine, Saitama" data-alt-ja="埼玉県、三峰" alt="" loading="lazy" width="1200" height="900">
            </picture>
          </div>
          <span class="eyebrow" data-en="SAITAMA" data-ja="埼玉"></span>
          <h2 data-en="Mitsumine." data-ja="三峰。"></h2>
          <p data-en="Public on ChalkMap, with parking, access notes and every documented line." data-ja="ChalkMapで公開中。駐車場、アクセス情報、記録されたすべてのラインを確認できます。"></p>
        </div>

        <div class="map-step" data-map-step data-crag-index="2">
          <div class="map-step-photo" data-map-photo>
            <picture>
              <source type="image/webp" srcset="assets/img/web/shimonita-1200.webp">
              <img src="assets/img/web/shimonita-1200.jpg" data-alt-en="Shimonita, Gunma" data-alt-ja="群馬県、下仁田" alt="" loading="lazy" width="1200" height="900">
            </picture>
          </div>
          <span class="eyebrow" data-en="GUNMA" data-ja="群馬"></span>
          <h2 data-en="Shimonita." data-ja="下仁田。"></h2>
          <p data-en="Public on ChalkMap, with parking, access notes and every documented line." data-ja="ChalkMapで公開中。駐車場、アクセス情報、記録されたすべてのラインを確認できます。"></p>
        </div>

        <div class="map-step" data-map-step data-crag-index="3">
          <div class="map-step-photo" data-map-photo>
            <picture>
              <source type="image/webp" srcset="assets/img/web/mitake-1200.webp">
              <img src="assets/img/web/mitake-1200.jpg" data-alt-en="Mitake, Tokyo" data-alt-ja="東京都、御岳" alt="" loading="lazy" width="1200" height="900">
            </picture>
          </div>
          <span class="eyebrow" data-en="TOKYO" data-ja="東京"></span>
          <h2 data-en="Mitake." data-ja="御岳。"></h2>
          <p data-en="Public on ChalkMap, with parking, access notes and every documented line." data-ja="ChalkMapで公開中。駐車場、アクセス情報、記録されたすべてのラインを確認できます。"></p>
        </div>
      </div>
    </div>
  </div>
</section>
