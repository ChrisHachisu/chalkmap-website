<section id="phone" class="section section-phone">
  <div class="container">

    <div class="phone-head">
      <p class="eyebrow" data-en="IN THE APP · アプリの中" data-ja="IN THE APP · アプリの中"></p>
      <h2 data-en="Built for the field." data-ja="現場で使える設計。"></h2>
    </div>

    <!-- Desktop: one pinned frame, screenshots slide through, captions flank it -->
    <div class="phone-stage" data-phone-pin>

      <div class="phone-side phone-side-left">
        <div class="phone-caption is-active" data-phone-cap>
          <p class="phone-caption-label" data-en="Map · Crags &amp; Boulders" data-ja="地図 · エリアとボルダー"></p>
          <p class="phone-caption-desc" data-en="Discover crags and boulders on a map built for outdoor exploration. Public areas come with directions, parking, and access notes." data-ja="外岩のためにつくった地図で、行きたいエリアや課題を探せます。公開されているエリアには、行き方・駐車場・アクセスの情報もまとまっています。"></p>
        </div>
        <div class="phone-caption" data-phone-cap>
          <p class="phone-caption-label" data-en="Recap · Your climbing" data-ja="まとめ · あなたの記録"></p>
          <p class="phone-caption-desc" data-en="Log your sends, build your record, follow other climbers, and see what the community is up to." data-ja="完登を記録して履歴を積み重ね、ほかのクライマーをフォローしたり、みんなの活動をのぞいたり。"></p>
        </div>
      </div>

      <div class="phone-frame-wrap">
        <div class="phone-frame" data-phone-frame>
          <div class="phone-notch" aria-hidden="true"></div>
          <div class="phone-screen">
            <img
              class="phone-shot is-visible"
              data-phone-shot
              src="assets/img/screen-map.png"
              data-src-en="assets/img/screen-map.png"
              data-src-ja="assets/img/screen-map-ja.png"
              data-alt-en="Map view with crag pins"
              data-alt-ja="エリアのピンを表示した地図画面"
              alt=""
              loading="lazy">
            <img
              class="phone-shot"
              data-phone-shot
              src="assets/img/screen-line.png"
              data-src-en="assets/img/screen-line.png"
              data-src-ja="assets/img/screen-line-ja.png"
              data-alt-en="A problem line drawn on a boulder photo"
              data-alt-ja="ボルダーの写真に表示されたライン"
              alt=""
              loading="lazy">
            <img
              class="phone-shot"
              data-phone-shot
              src="assets/img/screen-recap.png"
              data-src-en="assets/img/screen-recap.png"
              data-src-ja="assets/img/screen-recap-ja.png"
              data-alt-en="A climbing recap card"
              data-alt-ja="クライミングのまとめカード"
              alt=""
              loading="lazy">
          </div>
        </div>
      </div>

      <div class="phone-side phone-side-right">
        <div class="phone-caption" data-phone-cap>
          <p class="phone-caption-label" data-en="Lines · Drawn on the rock" data-ja="ライン · 岩の上に表示"></p>
          <p class="phone-caption-desc" data-en="See each problem drawn on the boulder photo with start holds, plus the original send videos from YouTube and Instagram, gathered in one place." data-ja="課題はボルダーの写真の上に、ラインとスタートホールドで表示。完登動画もまとめて見られるので、どこを登るのかで迷いません。"></p>
        </div>
      </div>

    </div>

        <div class="phone-caption is-active">
          <p class="phone-caption-label" data-en="Recap · Your climbing" data-ja="まとめ · あなたの記録"></p>
          <p class="phone-caption-desc" data-en="Log your sends, build your record, follow other climbers, and see what the community is up to." data-ja="完登を記録して履歴を積み重ね、ほかのクライマーをフォローしたり、みんなの活動をのぞいたり。"></p>
