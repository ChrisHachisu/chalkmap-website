        <li><span class="mono" data-en="RECORD" data-ja="記録"></span><span data-en="Your sends, your projects, your recap." data-ja="完登も、プロジェクトも、あなたのまとめも。"></span></li>
        <li><span class="mono" data-en="RESPECT" data-ja="リスペクト"></span><span data-en="Establishers, the people who open and look after a crag, decide what is public. Access rules travel with every crag." data-ja="エリアを開き、守ってきた開拓者が、公開するかどうかを決めます。アクセスのルールは、すべてのエリアに添えられます。"></span></li>
      </ul>

  </div>
